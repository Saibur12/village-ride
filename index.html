<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Village Ride - Customer</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f7fb;
    color: #222;
}

header {
    background: #111827;
    color: white;
    padding: 20px;
    text-align: center;
}

header h1 {
    color: #fbbf24;
}

.container {
    max-width: 500px;
    margin: 25px auto;
    padding: 15px;
}

.card {
    background: white;
    padding: 22px;
    border-radius: 15px;
    margin-bottom: 20px;
    box-shadow: 0 3px 12px #00000012;
}

h2 {
    margin-bottom: 18px;
    color: #111827;
}

input, select {
    width: 100%;
    padding: 13px;
    margin: 9px 0;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
}

button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: #f59e0b;
    color: #111;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
}

button:hover {
    background: #d97706;
}

.vehicle {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 15px;
}

.vehicle button {
    background: #e5e7eb;
    padding: 20px 8px;
}

.vehicle button.active {
    background: #fbbf24;
}

.hidden {
    display: none;
}

.fare {
    background: #ecfdf5;
    padding: 15px;
    border-radius: 10px;
    margin-top: 15px;
    line-height: 1.8;
}

footer {
    text-align: center;
    padding: 20px;
    color: #777;
}
</style>
</head>

<body>

<header>
    <h1>🚖 VILLAGE RIDE</h1>
    <p>Your Ride, Your Comfort</p>
</header>

<div class="container">

    <!-- CUSTOMER LOGIN -->
    <div class="card" id="loginSection">
        <h2>Customer Login</h2>
        <input type="tel" id="mobile"
        placeholder="Enter Mobile Number"
        maxlength="10">
        <button onclick="login()">Login</button>
    </div>

    <!-- CUSTOMER DETAILS -->
    <div class="card hidden" id="detailsSection">
        <h2>Customer Details</h2>
        <input type="text" id="name"
        placeholder="Enter Your Name">

        <input type="email" id="email"
        placeholder="Enter Email (Optional)">

        <button onclick="saveDetails()">Continue</button>
    </div>

    <!-- BOOKING SECTION -->
    <div class="card hidden" id="bookingSection">
        <h2>Book Your Ride</h2>

        <div class="vehicle">
            <button id="autoBtn"
            onclick="selectVehicle('Auto')">
                🛺<br>Auto
            </button>

            <button id="bikeBtn"
            onclick="selectVehicle('Bike')">
                🏍️<br>Bike
            </button>
        </div>

        <input type="text" id="pickup"
        placeholder="Enter Pickup Location">

        <input type="text" id="drop"
        placeholder="Enter Drop Location">

        <input type="number" id="km"
        placeholder="Enter Distance in KM"
        min="0.1" step="0.1"
        oninput="calculateFare()">

        <div class="fare">
            <p>Vehicle: <b id="vehicleName">Not Selected</b></p>
            <p>Distance: <b id="distance">0 KM</b></p>
            <p>Estimated Fare: ₹<b id="price">0</b></p>
        </div>

        <button onclick="confirmBooking()">
            Confirm Booking
        </button>
    </div>

    <!-- BOOKING CONFIRMATION -->
    <div class="card hidden" id="confirmationSection">
        <h2>Booking Submitted!</h2>
        <p id="bookingInfo"></p>
        <button onclick="location.reload()">New Booking</button>
    </div>

</div>

<footer>
    <p>© 2026 Village Ride. All Rights Reserved.</p>
</footer>

<script>
let vehicle = "";
let customer = {};
let fare = 0;

// Demo rates: change according to actual fares
const rates = {
    Auto: 15,
    Bike: 10
};

function login() {
    const mobile = document.getElementById("mobile").value;

    if (!/^[0-9]{10}$/.test(mobile)) {
        alert("Please enter a valid 10 digit mobile number");
        return;
    }

    customer.mobile = mobile;

    document.getElementById("loginSection").classList.add("hidden");
    document.getElementById("detailsSection").classList.remove("hidden");
}

function saveDetails() {
    const name = document.getElementById("name").value.trim();

    if (!name) {
        alert("Please enter your name");
        return;
    }

    customer.name = name;
    customer.email = document.getElementById("email").value;

    document.getElementById("detailsSection").classList.add("hidden");
    document.getElementById("bookingSection").classList.remove("hidden");
}

function selectVehicle(type) {
    vehicle = type;

    document.getElementById("vehicleName").innerText = type;

    document.getElementById("autoBtn").classList.toggle(
        "active", type === "Auto"
    );

    document.getElementById("bikeBtn").classList.toggle(
        "active", type === "Bike"
    );

    calculateFare();
}

function calculateFare() {
    const km = parseFloat(document.getElementById("km").value) || 0;

    document.getElementById("distance").innerText = km + " KM";

    fare = vehicle && km > 0
        ? Math.round(km * rates[vehicle])
        : 0;

    document.getElementById("price").innerText = fare;
}

function confirmBooking() {
    const pickup = document.getElementById("pickup").value.trim();
    const drop = document.getElementById("drop").value.trim();
    const km = parseFloat(document.getElementById("km").value);

    if (!vehicle) {
        alert("Please select Auto or Bike");
        return;
    }

    if (!pickup || !drop) {
        alert("Please enter pickup and drop locations");
        return;
    }

    if (!km || km <= 0) {
        alert("Please enter valid distance");
        return;
    }

    calculateFare();

    document.getElementById("bookingInfo").innerHTML =
        "Customer: " + customer.name +
        "<br>Mobile: " + customer.mobile +
        "<br>Vehicle: " + vehicle +
        "<br>Pickup: " + pickup +
        "<br>Drop: " + drop +
        "<br>Distance: " + km + " KM" +
        "<br>Estimated Fare: ₹" + fare +
        "<br><br>Demo booking submitted.";

    document.getElementById("bookingSection").classList.add("hidden");
    document.getElementById("confirmationSection").classList.remove("hidden");
}
</script>

</body>
</html>
